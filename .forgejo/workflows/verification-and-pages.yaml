name: Verification and Pages

on: workflow_call

env:
  ACTIONS_CHECKOUT_VERSION: df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
  ACTIONS_GIT_PAGES_VERSION: f22fa1240d3ca8a869468f08fe702d54520eafd2 # v2
  FLUTTER_VERSION: sha256:c49442d14c78101da086bac26620323d6e395c3602b0478ab872a7919b41fada # 3.44.3
  NODEJS_VERSION: 24.18.0 # https://nodejs.org
  NODEJS_CHECKSUM: 783130984963db7ba9cbd01089eaf2c2efb055c7c1693c943174b967b3050cb8 # https://nodejs.org/dist/

jobs:
  verification:
    name: Verify and publish to git-pages
    runs-on: codeberg-medium-lazy
    container:
      image: ghcr.io/gmeligio/flutter-web@${{ env.FLUTTER_VERSION }}
    steps:
      - name: Install Node.js
        run: |
          set -uo pipefail
          archive_name="node-v${NODEJS_VERSION}-linux-x64"
          archive_file="${archive_name}.tar.gz"
          curl --fail --silent --show-error \
            --location "https://nodejs.org/dist/v${NODEJS_VERSION}/${archive_file}" \
            --output "${archive_file}"
          echo "${NODEJS_CHECKSUM} ${archive_file}" | sha256sum --check
          tar --auto-compress --extract --file "${archive_file}" --directory "${HOME}"
          echo "${HOME}/${archive_name}/bin" >> "${FORGEJO_PATH}"
      - name: Clone repository
        uses: https://data.forgejo.org/actions/checkout@${{ env.ACTIONS_CHECKOUT_VERSION }}
      - name: Get packages
        run: flutter pub get
      - name: Generate l10n
        run: tool/flutter_gen_l10n.dart
      - name: Check for missing localizations
        run: tool/check_missing_localizations.dart
      - name: Check code formatting
        run: tool/dart_format.dart
      - name: Analyze code
        run: tool/flutter_analyze.dart --no-pub
      - name: Run tests in Dart VM
        run: tool/flutter_test.dart --no-pub --branch-coverage
      - name: Build example web app (non-weblate branch only)
        if: (forgejo.head_ref || forgejo.ref_name) != 'weblate'
        run: |
          flutter build web \
            --no-pub \
            --no-wasm-dry-run \
            --build-number '${{ forgejo.run_number }}' \
            --build-name '${{ forgejo.event.pull_request.head.sha || forgejo.sha }}' \
            --base-href '/${{ forgejo.event.repository.name }}/' \
            --csp \
            --release
        working-directory: packages/rrule_picker/example
      - name: Publish to git-pages (main branch only)
        if: (!forgejo.head_ref) && forgejo.ref_name == 'main'
        uses: https://data.forgejo.org/actions/git-pages@${{ env.ACTIONS_GIT_PAGES_VERSION }}
        with:
          site: https://${{ forgejo.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/
          token: ${{ forgejo.token }}
          source: packages/rrule_picker/example/build/web/
