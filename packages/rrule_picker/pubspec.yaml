name: rrule_picker
description: RRULE picker is a widget used to manipulate RRULEs in accordance to a subset of RFC 5545.
version: 0.1.5
homepage: https://github.com/0rzech/rrule_picker
repository: https://github.com/0rzech/rrule_picker/tree/main/packages/rrule_picker
issue_tracker: https://github.com/0rzech/rrule_picker/issues
screenshots:
  - description: Yearly recurrence (relative day, Linux).
    path: screenshots/linux_yearly_relative.png
  - description: Yearly recurrence (exact day, Android).
    path: screenshots/android_yearly_exact.png
  - description: Monthly recurrence (relative day, iOS).
    path: screenshots/ios_monthly_relative.png
  - description: Monthly recurrence (exact day, Linux).
    path: screenshots/linux_monthly_exact.png
  - description: Weekly recurrence (Android).
    path: screenshots/android_weekly.png
  - description: Weekly recurrence (iOS).
    path: screenshots/ios_weekly.png
  - description: Weekly recurrence (Linux).
    path: screenshots/linux_weekly.png
  - description: Daily recurrence (Android).
    path: screenshots/android_daily.png
  - description: No recurrence (iOS).
    path: screenshots/ios_never.png
topics:
  - flutter
  - material
  - picker
  - rrule
  - widget

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.20.2 <1.0.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  kiri_check: ^1.3.1
  mocktail: ^1.0.5
  spot: ^0.18.0

flutter:
  generate: true
