name: Weblate Push

on:
  push:
    branches:
      - weblate
    paths:
      - '**/*.arb'

jobs:
  weblate-push:
    name: Generate and commit Dart localizations

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gmeligio/flutter-web@sha256:c49442d14c78101da086bac26620323d6e395c3602b0478ab872a7919b41fada # 3.44.3

    timeout-minutes: 2

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: weblate
      - name: Generate l10n
        run: tool/flutter_gen_l10n.dart
      - name: Check l10n changes
        id: check-l10n-changes
        run: |
          set -u
          git add .
          if git diff --staged --quiet; then
            echo 'No changes'
            echo 'has_changes=false' >> "${GITHUB_OUTPUT}"
          else
            git diff --staged --name-status
            echo 'has_changes=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: Commit l10n
        if: steps.check-l10n-changes.outputs.has_changes == 'true'
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions@noreply.github.org'
          git commit -m 'Update generated localizations'
          git push
